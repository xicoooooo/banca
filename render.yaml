# Render blueprint for the backend. The frontend is deployed on Vercel.
services:
  - type: web
    name: banca-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      # Secrets and deployment-specific values are entered in the Render
      # dashboard, never committed.
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
